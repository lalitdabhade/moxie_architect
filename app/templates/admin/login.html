{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}admin-login{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <a class="brand login-brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ SITE.name }}<span class="brand-sub">Admin</span></span>
    </a>
    <h1 class="login-title">Sign in</h1>
    <form id="login-form" class="form" novalidate data-csrf="{{ login_csrf }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="50" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/admin/login.js"></script>{% endblock %}
