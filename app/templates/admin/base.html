<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <title>{% block title %}Admin{% endblock %} · {{ SITE.name }} Admin</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin {% block body_class %}{% endblock %}">
  {% if admin %}
  <header class="admin-header">
    <div class="admin-header-inner">
      <a class="brand" href="/admin">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">{{ SITE.name }}<span class="brand-sub">Admin</span></span>
      </a>
      <nav class="admin-nav" aria-label="Admin">
        <a href="/admin"{% if active == "dashboard" %} aria-current="page"{% endif %}>Dashboard</a>
        <a href="/admin/projects"{% if active == "projects" %} aria-current="page"{% endif %}>Projects</a>
        <a href="/admin/inquiries"{% if active == "inquiries" %} aria-current="page"{% endif %}>Inquiries</a>
        <a href="/" target="_blank" rel="noopener">View site</a>
      </nav>
      <div class="admin-user">
        <span class="admin-username">{{ admin.username }}</span>
        <button type="button" class="btn btn-small btn-ghost" data-logout>Log out</button>
      </div>
    </div>
  </header>
  {% endif %}
  <main id="main" class="admin-main">
    <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/admin/api.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
