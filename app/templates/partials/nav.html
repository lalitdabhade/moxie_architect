<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ SITE.name }}<span class="brand-sub">{{ SITE.subtitle }}</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar"></span><span class="visually-hidden">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for s in SECTIONS %}
        <li><a href="/{{ s.slug }}"{% if active == s.slug %} aria-current="page"{% endif %}>{{ s.name }}</a></li>
        {% endfor %}
        <li><a class="nav-cta" href="/inquiry"{% if active == "inquiry" %} aria-current="page"{% endif %}>Inquiry</a></li>
      </ul>
    </nav>
  </div>
</header>
